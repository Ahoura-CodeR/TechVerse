<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | TechVerse</title>

<link rel="stylesheet" href="/ThchVerse/css/login/login.css">

</head>


<body>


<main class="auth-container">


<div class="auth-card">


<div class="brand">

TECH<span>VERSE</span>

</div>



<h1>
Create Account
</h1>


<p class="subtitle">
Join TechVerse community
</p>




<form class="auth-form">


<div class="input-group">

<label>
Username
</label>

<input 
type="text"
placeholder="Enter username"
>


</div>




<div class="input-group">

<label>
Email
</label>

<input 
type="email"
placeholder="example@email.com"
>


</div>




<div class="input-group">

<label>
Password
</label>

<input 
type="password"
placeholder="Create password"
>


</div>



<div class="input-group">

<label>
Confirm Password
</label>

<input 
type="password"
placeholder="Repeat password"
>


</div>




<button class="auth-btn">

Create Account

</button>



</form>




<div class="divider">

<span>
OR
</span>

</div>




<button class="fake-login">

Continue with Google 🚀

</button>




<p class="switch">

Already have an account?

<a href="login.html">
Login
</a>

</p>




</div>


</main>


<script src="../js/auth.js"></script>


</body>

</html>
