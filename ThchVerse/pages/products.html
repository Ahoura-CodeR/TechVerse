<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://rsms.me">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">

    <link rel="stylesheet" href="/ThchVerse/css/products/products.css">

    <title>TechVerse | Products</title>
</head>

<body>

    <div class="container">

        <nav-bar></nav-bar>

        <hr>


        <main class="products-page">

            <!-- Breadcrumb -->

            <nav class="breadcrumb">

                <a href="/ThchVerse/pages/home.html">
                    Home
                </a>

                <svg width="7" height="11" viewBox="0 0 7 11" fill="none">
                    <path
                        d="M1 1L5.5 5.5L1 10"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>

                <a href="#">
                    Catalog
                </a>

                <svg width="7" height="11" viewBox="0 0 7 11" fill="none">
                    <path
                        d="M1 1L5.5 5.5L1 10"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>

                <span>
                    Smartphones
                </span>

            </nav>


            <!-- Top -->

            <div class="products-top">

                <p>
                    Selected Products:
                    <strong>85</strong>
                </p>

                <div class="sort-box">

                    <select class="sort-products">
                        <option>Sort By</option>
                        <option>By rating</option>
                        <option>Price: Low to High</option>
                        <option>Price: High to Low</option>
                        <option>By name</option>
                    </select>

                    <svg width="8" height="5" viewBox="0 0 8 5" fill="none">
                        <path
                            d="M1 1L4 4L7 1"
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>

                </div>

            </div>


            <!-- Main Content -->

            <section class="products-layout">


                <!-- Sidebar -->

                <aside class="filter-sidebar">


                    <!-- Brand -->

                    <div class="filter-section brand-section">

                        <button class="filter-heading">

                            <span>Brand</span>

                            <svg
                                class="brand-arrow"
                                width="8"
                                height="5"
                                viewBox="0 0 8 5"
                                fill="none"
                            >
                                <path
                                    d="M1 4L4 1L7 4"
                                    stroke="currentColor"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>

                        </button>


                        <div class="brand-search">

                            <svg
                                width="14"
                                height="14"
                                viewBox="0 0 14 14"
                                fill="none"
                            >
                                <circle
                                    cx="6"
                                    cy="6"
                                    r="4.5"
                                    stroke="currentColor"
                                />

                                <path
                                    d="M9.5 9.5L13 13"
                                    stroke="currentColor"
                                    stroke-linecap="round"
                                />
                            </svg>

                            <input
                                type="text"
                                placeholder="Search"
                                class="input-search"
                            >

                        </div>


                        <div class="brand-list">

                            <label>
                                <input type="checkbox" checked>
                                <span>Apple</span>
                                <small>110</small>
                            </label>

                            <label>
                                <input type="checkbox">
                                <span>Samsung</span>
                                <small>125</small>
                            </label>

                            <label>
                                <input type="checkbox">
                                <span>Xiaomi</span>
                                <small>68</small>
                            </label>

                            <label>
                                <input type="checkbox">
                                <span>Poco</span>
                                <small>44</small>
                            </label>

                            <label>
                                <input type="checkbox">
                                <span>OPPO</span>
                                <small>36</small>
                            </label>

                            <label>
                                <input type="checkbox">
                                <span>Honor</span>
                                <small>10</small>
                            </label>

                            <label>
                                <input type="checkbox">
                                <span>Motorola</span>
                                <small>34</small>
                            </label>

                            <label>
                                <input type="checkbox">
                                <span>Nokia</span>
                                <small>22</small>
                            </label>

                            <label>
                                <input type="checkbox">
                                <span>Realme</span>
                                <small>35</small>
                            </label>

                        </div>

                    </div>


                    <!-- Other Filters -->

                    <div class="filter-section">

                        <button class="filter-heading">
                            <span>Battery capacity</span>

                            <svg width="8" height="5" viewBox="0 0 8 5" fill="none">
                                <path
                                    d="M1 1L4 4L7 1"
                                    stroke="currentColor"
                                />
                            </svg>
                        </button>

                    </div>


                    <div class="filter-section">

                        <button class="filter-heading">
                            <span>Screen type</span>

                            <svg width="8" height="5" viewBox="0 0 8 5" fill="none">
                                <path
                                    d="M1 1L4 4L7 1"
                                    stroke="currentColor"
                                />
                            </svg>
                        </button>

                    </div>


                    <div class="filter-section">

                        <button class="filter-heading">
                            <span>Screen diagonal</span>

                            <svg width="8" height="5" viewBox="0 0 8 5" fill="none">
                                <path
                                    d="M1 1L4 4L7 1"
                                    stroke="currentColor"
                                />
                            </svg>
                        </button>

                    </div>


                    <div class="filter-section">

                        <button class="filter-heading">
                            <span>Protection class</span>

                            <svg width="8" height="5" viewBox="0 0 8 5" fill="none">
                                <path
                                    d="M1 1L4 4L7 1"
                                    stroke="currentColor"
                                />
                            </svg>
                        </button>

                    </div>


                    <div class="filter-section">

                        <button class="filter-heading">
                            <span>Built-in memory</span>

                            <svg width="8" height="5" viewBox="0 0 8 5" fill="none">
                                <path
                                    d="M1 1L4 4L7 1"
                                    stroke="currentColor"
                                />
                            </svg>
                        </button>

                    </div>

                </aside>


                <!-- Products Area -->

                <div class="products-area">

                    <!-- JS will generate products here -->

                    <product-category></product-category>


                    <!-- Pagination -->

                    <nav class="pagination">

                        <button class="pagination-arrow previous">
                            <svg width="6" height="10" viewBox="0 0 6 10" fill="none">
                                <path
                                    d="M5 1L1 5L5 9"
                                    stroke="currentColor"
                                />
                            </svg>
                        </button>
                        

                        <button class="pagination-arrow next">
                            <svg width="6" height="10" viewBox="0 0 6 10" fill="none">
                                <path
                                    d="M1 1L5 5L1 9"
                                    stroke="currentColor"
                                />
                            </svg>
                        </button>

                    </nav>

                </div>

            </section>

        </main>


        <footer-site></footer-site>

    </div>


    <script type="module" defer src="/ThchVerse/js/nav.js"></script>
    <script type="module" defer src="/ThchVerse/js/products.js"></script>

</body>

</html>
