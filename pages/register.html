<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register | TechVerse</title>

    <link rel="stylesheet" href="/css/variables.css" />

    <link rel="stylesheet" href="/css/global.css" />

    <link rel="stylesheet" href="/css/animations.css" />
    <link rel="stylesheet" href="/css/mose.css"/>


    <link rel="stylesheet" href="/css/login/login.css" />
  </head>

  <body>
    <main class="auth-container">
      <div class="auth-card">
        <div class="brand">TECH<span>VERSE</span></div>

        <h1>Create Account</h1>

        <p class="subtitle">Join TechVerse community</p>

        <form class="auth-form">
          <div class="input-group">
            <label>Username</label>

            <input
              type="text"
              class="username-input"
              placeholder="Enter username"
              autocomplete="username"
            />
          </div>

          <div class="input-group">
            <label>Email</label>

            <input
              type="email"
              class="email-input"
              placeholder="example@email.com"
              autocomplete="email"
            />
          </div>

          <div class="input-group">
            <label>Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                class="password-input"
                placeholder="Create password"
                autocomplete="new-password"
              />

              <button
                type="button"
                class="password-toggle"
                aria-label="Show password"
              >
                👁
              </button>
            </div>
          </div>

          <div class="input-group">
            <label>Confirm Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                class="confirm-password-input"
                placeholder="Repeat password"
                autocomplete="new-password"
              />

              <button
                type="button"
                class="password-toggle"
                aria-label="Show password"
              >
                👁
              </button>
            </div>
          </div>

          <button class="auth-btn" type="submit">Create Account</button>
        </form>

        <div class="divider">
          <span>OR</span>
        </div>

        <button class="fake-login" type="button">
          Continue with Google 🚀
        </button>

        <p class="switch">
          Already have an account?

          <a href="login.html"> Login </a>
        </p>
      </div>
    </main>

    <div class="cursor-glow"></div>
    <script type="module" src="/js/mose.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
