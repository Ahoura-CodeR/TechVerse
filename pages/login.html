<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | TechVerse</title>
    <link rel="icon" href="../assets/icons/iconTech.png">


    <link rel="stylesheet" href="../css/variables.css" />

    <link rel="stylesheet" href="../css/global.css" />

    <link rel="stylesheet" href="../css/animations.css" />

    <link rel="stylesheet" href="../css/mose.css"/>


    <link rel="stylesheet" href="../css/login/login.css" />
  </head>

  <body>
    <main class="auth-container">
      <div class="auth-card">
        <div class="brand">TECH<span>VERSE</span></div>

        <h1>Welcome Back</h1>

        <p class="subtitle">Login to continue your journey</p>

        <form class="auth-form">
          <div class="input-group">
            <label> Email </label>

            <input type="email" placeholder="example@email.com" />
          </div>

          <div class="input-group">
            <label>Password</label>

            <div class="password-wrapper">
              <input type="password" placeholder="••••••••" />

              <button
                type="button"
                class="password-toggle"
                aria-label="Show password"
              >
                👁
              </button>
            </div>
          </div>

          <button class="auth-btn">Login</button>
        </form>

        <div class="divider">
          <span> OR </span>
        </div>

        <button class="fake-login">Continue with Google 🚀</button>

        <p class="switch">
          Don't have an account?

          <a href="./register.html"> Create one </a>
        </p>
      </div>
    </main>

    <div class="cursor-glow"></div>
    <script type="module" src="../js/mose.js"></script>

    <script type="module" src="../js/auth.js"></script>

  </body>
</html>
