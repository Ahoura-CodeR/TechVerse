<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://rsms.me" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="icon" href="/assets/icons/iconTech.png">


    <link rel="stylesheet" href="/css/variables.css" />

    <link rel="stylesheet" href="/css/global.css" />

    <link rel="stylesheet" href="/css/animations.css" />

    <link rel="stylesheet" href="/css/mose.css"/>

    <link rel="stylesheet" href="/css/products/products.css" />

    <title>TechVerse | Products</title>
  </head>

  <body>
    <!-- =====================================================
       PAGE LOADER
  ====================================================== -->

    <div class="page-loader">
      <div class="loader-content">
        <div class="loader-orbit">
          <div class="orbit orbit-1"></div>
          <div class="orbit orbit-2"></div>
          <div class="orbit orbit-3"></div>

          <div class="loader-core">
            <span>TV</span>
          </div>
        </div>

        <div class="loader-brand">TECH<span>VERSE</span></div>

        <div class="loader-status">
          <span class="loader-line"></span>

          <span class="loader-text"> INITIALIZING SYSTEM </span>

          <span class="loader-dots"> ... </span>
        </div>
      </div>
    </div>

    <!-- =====================================================
       CONTAINER
  ====================================================== -->

    <div class="container">
      <nav-bar></nav-bar>

      <hr />

      <!-- ===================================================
         MAIN
    ==================================================== -->

      <main class="products-page">
        <!-- =================================================
           BREADCRUMB
      ================================================== -->

        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="/index.html"> Home </a>

          <svg
            width="7"
            height="11"
            viewBox="0 0 7 11"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M1 1L5.5 5.5L1 10"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <a href="#"> Catalog </a>

          <svg
            width="7"
            height="11"
            viewBox="0 0 7 11"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M1 1L5.5 5.5L1 10"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <span> Smartphones </span>
        </nav>

        <!-- =================================================
           TOP BAR
      ================================================== -->

        <div class="products-top">
          <p>
            Selected Products:
            <strong>85</strong>
          </p>

          <div class="sort-box">
            <select class="sort-products">
              <option value="">Sort By</option>

              <option value="By rating">By rating</option>

              <option value="Price: Low to High">Price: Low to High</option>

              <option value="Price: High to Low">Price: High to Low</option>

              <option value="By name">By name</option>
            </select>

            <svg
              width="8"
              height="5"
              viewBox="0 0 8 5"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M1 1L4 4L7 1"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </div>

        <!-- =================================================
           PRODUCTS LAYOUT
      ================================================== -->

        <section class="products-layout">
          <!-- ===============================================
             FILTER SIDEBAR
        ================================================ -->

          <aside class="filter-sidebar">
            <!-- =============================================
               BRAND
          ============================================== -->

            <div class="filter-section brand-section">
              <button class="filter-heading" type="button">
                <span> Brand </span>

                <svg
                  class="brand-arrow"
                  width="8"
                  height="5"
                  viewBox="0 0 8 5"
                  fill="none"
                  aria-hidden="true"
                >
                  <path
                    d="M1 1L4 4L7 1"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>

              <div class="brand-search">
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 14 14"
                  fill="none"
                  aria-hidden="true"
                >
                  <circle cx="6" cy="6" r="4.5" stroke="currentColor" />

                  <path
                    d="M9.5 9.5L13 13"
                    stroke="currentColor"
                    stroke-linecap="round"
                  />
                </svg>

                <input type="text" placeholder="Search" class="input-search" />
              </div>

              <!--
              Brand options are generated by JS
              from products.json
            -->

              <div class="brand-list"></div>
            </div>

            <!-- =============================================
               BATTERY
          ============================================== -->

            <div class="filter-section">
              <button class="filter-heading" type="button">
                <span> Battery capacity </span>

                <svg
                  width="8"
                  height="5"
                  viewBox="0 0 8 5"
                  fill="none"
                  aria-hidden="true"
                >
                  <path
                    d="M1 1L4 4L7 1"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>

              <div class="filter-options"></div>
            </div>

            <!-- =============================================
               SCREEN TYPE
          ============================================== -->

            <div class="filter-section">
              <button class="filter-heading" type="button">
                <span> Screen type </span>

                <svg
                  width="8"
                  height="5"
                  viewBox="0 0 8 5"
                  fill="none"
                  aria-hidden="true"
                >
                  <path
                    d="M1 1L4 4L7 1"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>

              <div class="filter-options"></div>
            </div>

            <!-- =============================================
               SCREEN DIAGONAL
          ============================================== -->

            <div class="filter-section">
              <button class="filter-heading" type="button">
                <span> Screen diagonal </span>

                <svg
                  width="8"
                  height="5"
                  viewBox="0 0 8 5"
                  fill="none"
                  aria-hidden="true"
                >
                  <path
                    d="M1 1L4 4L7 1"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>

              <div class="filter-options"></div>
            </div>

            <!-- =============================================
               PROTECTION
          ============================================== -->

            <div class="filter-section">
              <button class="filter-heading" type="button">
                <span> Protection class </span>

                <svg
                  width="8"
                  height="5"
                  viewBox="0 0 8 5"
                  fill="none"
                  aria-hidden="true"
                >
                  <path
                    d="M1 1L4 4L7 1"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>

              <div class="filter-options"></div>
            </div>

            <!-- =============================================
               STORAGE
          ============================================== -->

            <div class="filter-section">
              <button class="filter-heading" type="button">
                <span> Built-in memory </span>

                <svg
                  width="8"
                  height="5"
                  viewBox="0 0 8 5"
                  fill="none"
                  aria-hidden="true"
                >
                  <path
                    d="M1 1L4 4L7 1"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>

              <div class="filter-options"></div>
            </div>
          </aside>

          <!-- ===============================================
             PRODUCTS AREA
        ================================================ -->

          <div class="products-area">
            <product-category></product-category>
          </div>
        </section>
      </main>

      <!-- ===================================================
         FOOTER
    ==================================================== -->

      <footer-site></footer-site>
    </div>

    <!-- =====================================================
       SCRIPTS
  ====================================================== -->
    <div class="cursor-glow"></div>
    <script type="module" src="/js/mose.js"></script>

    <script type="module" defer src="/js/nav.js"></script>

    <script type="module" defer src="/js/products.js"></script>
  </body>
</html>
